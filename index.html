
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Your Simple Note App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Your thoughts, organised in one place.</p>
    </header>

    <main>
        <section aria-labelledby="add-heading">
            <h2 id="add-heading">Add a note</h2>

            <form id="note-form">
                <div>
                    <label for="note-input">Your note</label>
                    <input
                        type="text"
                        id="note-input"
                        name="note"
                        placeholder="Write your note here..."
                        maxlength="200"
                    >
                </div>

                <div>
                    <label for="note-category">Category</label>
                    <select id="note-category" name="category">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>

                <button type="submit">Add Note</button>
            </form>

            <p id="error-message" role="alert"></p>
        </section>

        <section aria-labelledby="notes-heading">
            <h2 id="notes-heading">Your notes</h2>

            <label for="search-input">Search notes</label>
            <input
                type="search"
                id="search-input"
                placeholder="Search your notes..."
            >

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. Keep your thoughts organised.</p>
    </footer>
</body>
</html>
